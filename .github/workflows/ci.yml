name: CI

# Pull-request gate. Deploy (deploy.yml) runs the same verify suite before
# publishing on push to main, so PRs and production are checked by one source.
on:
  pull_request:
    branches:
      - main

# Least privilege: the PR gate only reads the repo.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify codegen parity
        run: npm run verify:ci

      - name: Typecheck + build
        run: npm run build
